name: deploy

# 刻意只留手动触发：ADR-0010 把「push 即部署」的隐式性换成了显式动作，
# 因为静态资产 + D1 迁移一旦自动跑，回滚面比纯静态站大得多。
# 前置条件（首次部署前必须在仓库 Secrets 里配好）：
#   CLOUDFLARE_API_TOKEN  —— 权限：Workers Scripts:Edit、D1:Edit
#   CLOUDFLARE_ACCOUNT_ID
# D1 与自定义域已就位（2026-10-01 实跑）：database_id = f72390fe-a506-4a88-8db7-af7213657947，
# 部署目标 = https://jevqipan.logicc.top （wrangler.jsonc 的 routes 里声明为 custom_domain）。
# 注意 workers_dev 未显式开启（wrangler 默认关闭），因此 *.workers.dev 不是入口。
on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 部署前先对远程 D1 应用迁移
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      - name: 引擎自检（部署前最后一道）
        run: npm run test:engines

      - name: 应用 D1 迁移
        if: ${{ inputs.run_migrations }}
        run: npx wrangler d1 migrations apply jev-qiguan --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 部署 Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
